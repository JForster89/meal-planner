<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Recipe</title>
</head>
<body>
    <h1>Edit Recipe</h1>
    <form method="POST">
        <label for="name">Recipe Name:</label><br>
        <input type="text" id="name" name="name" value="{{ recipe.name }}" required><br><br>
        
        <label for="ingredients">Ingredients (separate with commas):</label><br>
        <input type="text" id="ingredients" name="ingredients" value="{{ recipe.ingredients }}" required><br><br>
        
        <label for="instructions">Instructions:</label><br>
        <textarea id="instructions" name="instructions" rows="4" required>{{ recipe.instructions }}</textarea><br><br>
        
        <button type="submit">Update Recipe</button>
    </form>
    <br>
    <a href="/recipes">Back to Recipes</a>
</body>
</html>
