# Fly.io deployment.
app = "jf-meal-planner"
primary_region = "lhr"

[build]

[env]
  RECIPES_DB = "/data/recipes.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Scaling to zero is fine for one user: it wakes on the first request.
  min_machines_running = 0

  # Deliberately no [[http_service.checks]]. A periodic health check counts as
  # traffic, so it holds the machine awake and bills runtime around the clock -
  # verified: the machine stayed "started" through three idle minutes with one
  # configured. /healthz still exists for checking by hand.

[[mounts]]
  source = "recipes_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
