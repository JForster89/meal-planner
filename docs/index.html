<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2f7d32">
<title>Shopping List</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shopping">
<style>
:root {
  --bg:#f6f7f5; --surface:#fff; --border:#e2e5e0; --text:#1c2119;
  --muted:#6b7280; --accent:#2f7d32; --accent-dark:#24631f; --accent-soft:#eaf4ea;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#14171a; --surface:#1d2125; --border:#2d3339; --text:#e8eae7;
    --muted:#9aa3ad; --accent:#5cbf60; --accent-dark:#7bd47f; --accent-soft:#1e2c1f;
  }
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
     background:var(--bg);color:var(--text);line-height:1.5;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:10;background:var(--surface);
       border-bottom:1px solid var(--border);padding:.7rem 1rem}
.head-row{display:flex;align-items:center;gap:.75rem;max-width:700px;margin:0 auto}
h1{font-size:1.15rem;margin:0;flex:1}
main{max-width:700px;margin:0 auto;padding:1rem 1rem 4rem}
.track{flex:1;height:8px;background:var(--border);border-radius:999px;overflow:hidden}
.fill{height:100%;background:var(--accent);transition:width .25s ease}
.count{font-size:.85rem;color:var(--muted);white-space:nowrap}
ul{list-style:none;margin:0;padding:0}
li{background:var(--surface);border:1px solid var(--border);border-radius:12px;
   margin-bottom:.4rem;overflow:hidden}
label{display:flex;align-items:center;gap:.75rem;padding:.7rem .9rem;
      min-height:56px;cursor:pointer}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent);flex:0 0 auto;cursor:pointer}
.txt{flex:1;min-width:0}
.qty{font-weight:700}
.for{display:block;font-size:.78rem;color:var(--muted)}
li.done{opacity:.5}
li.done .txt{text-decoration:line-through}
/* Aisle signposts: readable while scanning one-handed, without competing
   with the items themselves. */
li.aisle-head{background:transparent;border:none;border-radius:0;margin:1.1rem 0 .35rem;
  padding:0 .2rem .3rem;border-bottom:1px solid var(--border);
  font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;
  color:var(--accent-dark);display:flex;justify-content:space-between;align-items:baseline}
li.aisle-head:first-child{margin-top:0}
li.aisle-head .n{font-weight:500;color:var(--muted);letter-spacing:0}
.pill{display:inline-block;font-size:.7rem;font-weight:700;text-transform:uppercase;
      letter-spacing:.03em;padding:.1rem .45rem;border-radius:999px;
      background:var(--accent-soft);color:var(--accent-dark);border:1px solid var(--border)}
.meta{color:var(--muted);font-size:.85rem;margin:.25rem 0 1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;
     padding:.5rem 1rem;border:1px solid var(--border);border-radius:10px;
     background:transparent;color:var(--text);font-size:.9rem;font-weight:600;
     cursor:pointer;font-family:inherit}
.btn:hover{background:var(--accent-soft);color:var(--accent-dark)}
.row{display:flex;gap:.5rem;margin:1rem 0;flex-wrap:wrap}
.add{display:flex;gap:.5rem;margin-top:1rem}
.add input[type=text]{flex:1;padding:.65rem .7rem;min-height:44px;border:1px solid var(--border);
     border-radius:10px;background:var(--surface);color:var(--text);font-size:1rem}
h2{font-size:1rem;margin:1.5rem 0 .5rem;color:var(--muted)}
.empty{text-align:center;padding:2rem 1rem;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="head-row">
    <h1>Shopping list</h1>
    <div class="track"><div class="fill" id="fill"></div></div>
    <span class="count" id="count"></span>
  </div>
</header>
<main>
  <p class="meta">3 recipes &middot; updated Sun 16 Aug, 23:39</p>
  <ul id="list"><li class="aisle-head">Fruit &amp; Veg<span class="n">7</span></li>
<li><label><input type="checkbox" data-key="avocado|"><span class="txt"><span class="qty">1</span> Avocado<span class="for">Cheesy Mexican Style Beef Hash with Crispy Potato Top and Guacamole</span></span></label></li>
<li><label><input type="checkbox" data-key="bell pepper|"><span class="txt"><span class="qty">2</span> Bell Pepper<span class="for">Cheesy Mexican Style Beef Hash with Crispy Potato Top and Guacamole</span></span></label></li>
<li><label><input type="checkbox" data-key="echalion shallot|"><span class="txt"><span class="qty">2</span> Echalion Shallot<span class="for">Chorizo-Crusted Penne &#x27;n&#x27; Cheese with Garlicky Tenderstem Broccoli</span></span></label></li>
<li><label><input type="checkbox" data-key="garlic|"><span class="txt"><span class="qty">7</span> Garlic Clove<span class="for">Cheesy Mexican Style Beef Hash with Crispy Potato Top and Guacamole, Chorizo-Crusted Penne &#x27;n&#x27; Cheese with Garlicky Tenderstem Broccoli</span></span></label></li>
<li><label><input type="checkbox" data-key="lime|"><span class="txt"><span class="qty">1</span> Lime<span class="for">Cheesy Mexican Style Beef Hash with Crispy Potato Top and Guacamole</span></span></label></li>
<li><label><input type="checkbox" data-key="potato|"><span class="txt"><span class="qty">700</span> Potatoes<span class="for">Cheesy Mexican Style Beef Hash with Crispy Potato Top and Guacamole</span></span></label></li>
<li><label><input type="checkbox" data-key="tenderstem® broccoli|"><span class="txt"><span class="qty">400</span> Tenderstem® Broccoli<span class="for">Chorizo-Crusted Penne &#x27;n&#x27; Cheese with Garlicky Tenderstem Broccoli</span></span></label></li>
<li class="aisle-head">Meat &amp; Fish<span class="n">2</span></li>
<li><label><input type="checkbox" data-key="british beef mince|"><span class="txt"><span class="qty">360</span> British Beef Mince<span class="for">Cheesy Mexican Style Beef Hash with Crispy Potato Top and Guacamole</span></span></label></li>
<li><label><input type="checkbox" data-key="chorizo|"><span class="txt"><span class="qty">180</span> Chorizo<span class="for">Chorizo-Crusted Penne &#x27;n&#x27; Cheese with Garlicky Tenderstem Broccoli</span></span></label></li>
<li class="aisle-head">Dairy &amp; Eggs<span class="n">2</span></li>
<li><label><input type="checkbox" data-key="creme fraiche|"><span class="txt"><span class="qty">450</span> Creme Fraiche<span class="for">Chorizo-Crusted Penne &#x27;n&#x27; Cheese with Garlicky Tenderstem Broccoli</span></span></label></li>
<li><label><input type="checkbox" data-key="mature cheddar cheese|"><span class="txt"><span class="qty">225</span> Mature Cheddar Cheese<span class="for">Cheesy Mexican Style Beef Hash with Crispy Potato Top and Guacamole, Chorizo-Crusted Penne &#x27;n&#x27; Cheese with Garlicky Tenderstem Broccoli</span></span></label></li>
<li class="aisle-head">Bakery<span class="n">1</span></li>
<li><label><input type="checkbox" data-key="panko breadcrumbs|"><span class="txt"><span class="qty">100</span> Panko Breadcrumbs<span class="for">Chorizo-Crusted Penne &#x27;n&#x27; Cheese with Garlicky Tenderstem Broccoli</span></span></label></li>
<li class="aisle-head">Cupboard<span class="n">7</span></li>
<li><label><input type="checkbox" data-key="beef stock paste|"><span class="txt"><span class="qty">15</span> Beef Stock Paste<span class="for">Cheesy Mexican Style Beef Hash with Crispy Potato Top and Guacamole</span></span></label></li>
<li><label><input type="checkbox" data-key="chicken stock powder|"><span class="txt"><span class="qty">4</span> Chicken Stock Powder<span class="for">Chorizo-Crusted Penne &#x27;n&#x27; Cheese with Garlicky Tenderstem Broccoli</span></span></label></li>
<li><label><input type="checkbox" data-key="dried thyme|"><span class="txt"><span class="qty">2</span> Dried Thyme<span class="for">Chorizo-Crusted Penne &#x27;n&#x27; Cheese with Garlicky Tenderstem Broccoli</span></span></label></li>
<li><label><input type="checkbox" data-key="finely chopped tomatoes|"><span class="txt"><span class="qty">1</span> Finely Chopped Tomatoes<span class="for">Cheesy Mexican Style Beef Hash with Crispy Potato Top and Guacamole</span></span></label></li>
<li><label><input type="checkbox" data-key="mexican style spice mix|"><span class="txt"><span class="qty">1</span> Mexican Style Spice Mix<span class="for">Cheesy Mexican Style Beef Hash with Crispy Potato Top and Guacamole</span></span></label></li>
<li><label><input type="checkbox" data-key="penne pasta|"><span class="txt"><span class="qty">600</span> Penne Pasta<span class="for">Chorizo-Crusted Penne &#x27;n&#x27; Cheese with Garlicky Tenderstem Broccoli</span></span></label></li>
<li><label><input type="checkbox" data-key="plain flour|"><span class="txt"><span class="qty">48</span> Plain Flour<span class="for">Chorizo-Crusted Penne &#x27;n&#x27; Cheese with Garlicky Tenderstem Broccoli</span></span></label></li></ul>

  <h2>Anything else</h2>
  <div class="add">
    <input type="text" id="extra" placeholder="Milk, bin bags, …" autocomplete="off">
    <button class="btn" id="add-btn">Add</button>
  </div>
  <ul id="extras"></ul>

  <div class="row">
    <a class="btn" href="./cook.html">Cook mode &rarr;</a>
    <button class="btn" id="reset">Untick all</button>
  </div>
  <p class="meta">Ticks are saved on this device. Works offline once loaded.</p>
</main>

<script>
(function () {
  // Ticks are keyed by ingredient, not by position, so republishing the list
  // after adding a recipe keeps everything you'd already ticked.
  var STORE = 'shopping-ticks-v1';
  var EXTRAS = 'shopping-extras-v1';

  function load(key) {
    try { return JSON.parse(localStorage.getItem(key)) || {}; }
    catch (e) { return {}; }
  }
  function save(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }

  var ticks = load(STORE);
  var extras = load(EXTRAS);
  if (!Array.isArray(extras.items)) extras = { items: [] };

  function refresh() {
    var boxes = document.querySelectorAll('input[type=checkbox]');
    var done = 0;
    boxes.forEach(function (b) { if (b.checked) done++; });
    var total = boxes.length;
    document.getElementById('fill').style.width = total ? (done / total * 100) + '%' : '0%';
    document.getElementById('count').textContent = done + '/' + total;
  }

  function wire(box) {
    box.addEventListener('change', function () {
      box.closest('li').classList.toggle('done', box.checked);
      if (box.dataset.key) {
        ticks[box.dataset.key] = box.checked;
        save(STORE, ticks);
      } else {
        var i = parseInt(box.dataset.extra, 10);
        extras.items[i].done = box.checked;
        save(EXTRAS, extras);
      }
      refresh();
    });
  }

  document.querySelectorAll('#list input[type=checkbox]').forEach(function (box) {
    if (ticks[box.dataset.key]) {
      box.checked = true;
      box.closest('li').classList.add('done');
    }
    wire(box);
  });

  function renderExtras() {
    var ul = document.getElementById('extras');
    ul.innerHTML = '';
    extras.items.forEach(function (item, i) {
      var li = document.createElement('li');
      if (item.done) li.className = 'done';
      var label = document.createElement('label');
      var box = document.createElement('input');
      box.type = 'checkbox';
      box.dataset.extra = i;
      box.checked = !!item.done;
      var span = document.createElement('span');
      span.className = 'txt';
      // textContent, not innerHTML - whatever gets typed here is never markup.
      span.textContent = item.text;
      label.appendChild(box);
      label.appendChild(span);
      li.appendChild(label);
      ul.appendChild(li);
      wire(box);
    });
    refresh();
  }

  document.getElementById('add-btn').addEventListener('click', function () {
    var input = document.getElementById('extra');
    var text = input.value.trim();
    if (!text) return;
    extras.items.push({ text: text, done: false });
    save(EXTRAS, extras);
    input.value = '';
    renderExtras();
  });

  document.getElementById('extra').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); document.getElementById('add-btn').click(); }
  });

  document.getElementById('reset').addEventListener('click', function () {
    if (!confirm('Untick everything?')) return;
    ticks = {};
    save(STORE, ticks);
    extras.items.forEach(function (i) { i.done = false; });
    save(EXTRAS, extras);
    document.querySelectorAll('#list input[type=checkbox]').forEach(function (b) {
      b.checked = false;
      b.closest('li').classList.remove('done');
    });
    renderExtras();
  });

  renderExtras();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
